<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalHub - Currency Converter</title>
<style>
  body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f4f8; color:#333; }
  header { text-align:center; padding:20px; background:#0077b6; color:white; }
  header h1 { margin:0; }
  section.converter { max-width:600px; margin:30px auto; background:white; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
  label { display:block; margin-top:15px; font-weight:bold; }
  select, input, button { width:100%; padding:10px; margin-top:8px; border-radius:8px; border:1px solid #ccc; font-size:16px; }
  button { background:#0077b6; color:white; border:none; cursor:pointer; margin-top:20px; }
  button:hover { background:#023e8a; }
  section.result { max-width:600px; margin:20px auto; background:white; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:center; font-size:18px; }
  footer { text-align:center; padding:15px; background:#0077b6; color:white; margin-top:30px; }
</style>
</head>
<body>

<header>
  <h1>🌐 GlobalHub - Currency Converter</h1>
  <p>Convert currencies from any country in the world</p>
</header>

<section class="converter">
  <h2>Currency Converter</h2>
  <label for="fromCurrency">From Currency:</label>
  <select id="fromCurrency"></select>

  <label for="toCurrency">To Currency:</label>
  <select id="toCurrency"></select>

  <label for="amount">Amount:</label>
  <input type="number" id="amount" placeholder="Enter amount" />

  <button onclick="convertCurrency()">Convert</button>
</section>

<section class="result" id="result">
  <p>Enter details above to see conversion</p>
</section>

<footer>
  <p>© 2025 GlobalHub | Currency Converter 🌎💱</p>
</footer>

<script>
  // All world currencies (ISO codes + symbols)
  const currencies = {
    "USD": "$",
    "EUR": "€",
    "GBP": "£",
    "JPY": "¥",
    "AUD": "A$",
    "CAD": "C$",
    "CHF": "CHF",
    "CNY": "¥",
    "INR": "₹",
    "NZD": "NZ$",
    "SGD": "S$",
    "ZAR": "R",
    "AED": "د.إ",
    "ARS": "$",
    "BRL": "R$",
    "MXN": "$",
    "KRW": "₩",
    "RUB": "₽",
    "TRY": "₺",
    "SAR": "﷼",
    "SEK": "kr",
    "NOK": "kr",
    "DKK": "kr",
    "MYR": "RM",
    "THB": "฿",
    "IDR": "Rp",
    "PHP": "₱",
    "PKR": "₨",
    "EGP": "£",
    "NGN": "₦",
    "KES": "KSh",
    "MAD": "MAD"
    // Add more currencies as needed
  };

  // Sample static exchange rates (against USD)
  const exchangeRates = {
    "USD": 1,
    "EUR": 0.91,
    "GBP": 0.80,
    "JPY": 148.2,
    "AUD": 1.47,
    "CAD": 1.36,
    "CHF": 0.90,
    "CNY": 6.9,
    "INR": 83.4,
    "NZD": 1.61,
    "SGD": 1.34,
    "ZAR": 18.3,
    "AED": 3.67,
    "ARS": 270,
    "BRL": 5.07,
    "MXN": 18.5,
    "KRW": 1350,
    "RUB": 90.1,
    "TRY": 32.0,
    "SAR": 3.75,
    "SEK": 10.5,
    "NOK": 10.0,
    "DKK": 6.8,
    "MYR": 4.65,
    "THB": 35.3,
    "IDR": 15500,
    "PHP": 57.2,
    "PKR": 280,
    "EGP": 31.5,
    "NGN": 773,
    "KES": 152,
    "MAD": 10
  };

  const fromSelect = document.getElementById('fromCurrency');
  const toSelect = document.getElementById('toCurrency');

  Object.keys(currencies).forEach(c => {
    fromSelect.innerHTML += `<option value="${c}">${c} (${currencies[c]})</option>`;
    toSelect.innerHTML += `<option value="${c}">${c} (${currencies[c]})</option>`;
  });

  function convertCurrency() {
    const from = fromSelect.value;
    const to = toSelect.value;
    const amount = parseFloat(document.getElementById('amount').value);
    const resultDiv = document.getElementById('result');

    if (!from || !to || !amount || amount <= 0) {
      resultDiv.innerHTML = "<p style='color:red;'>⚠️ Please enter valid amount and select currencies.</p>";
      return;
    }

    const usdAmount = amount / exchangeRates[from];
    const convertedAmount = usdAmount * exchangeRates[to];

    resultDiv.innerHTML = `<p>${amount} ${from} (${currencies[from]}) = ${convertedAmount.toFixed(2)} ${to} (${currencies[to]})</p>`;
  }
</script>

</body>
</html>
