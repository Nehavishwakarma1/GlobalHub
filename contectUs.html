<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - GlobalHub</title>

<link rel="stylesheet" href="style.css">

<style>

/* HERO */
.contact-hero {
  height: 50vh;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
  url('https://images.unsplash.com/photo-1521791136064-7986c2920216');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
}

.contact-hero h1 {
  font-size: 40px;
}

/* MAIN CONTAINER */
.contact-container {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  padding: 50px 20px;
  max-width: 1100px;
  margin: auto;
}

/* FORM */
.contact-form {
  flex: 1;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.contact-form h2 {
  margin-bottom: 20px;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.contact-form button {
  width: 100%;
  padding: 12px;
  background: #0077b6;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.contact-form button:hover {
  background: #023e8a;
}

/* INFO */
.contact-info {
  flex: 1;
  background: #f4f6f9;
  padding: 25px;
  border-radius: 12px;
}

.contact-info h2 {
  margin-bottom: 15px;
}

.info-box {
  margin-bottom: 15px;
}

.info-box strong {
  display: block;
}

/* MAP */
.map {
  margin-top: 20px;
  border-radius: 10px;
  overflow: hidden;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">🌍 GlobalHub</div>
  <nav>
    <ul>
       <li><a href="home.html">Home</a></li>
        <li><a href="aboutUs.html">About Us</a></li>
        <li><a href="contectUs.html">Contect Us</a></li>
        <li><a href="Community.html">Community</a></li>
        <li><a href="signIn.html">Sign in</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<!-- HERO -->
<section class="contact-hero">
  <h1>Contact Us 📞</h1>
</section>

<!-- CONTENT -->
<section class="contact-container">

  <!-- FORM -->
  <div class="contact-form">
    <h2>Send Us a Message</h2>

    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="5" placeholder="Your Message" required></textarea>

    <button>Send Message</button>
  </div>

  <!-- INFO -->
  <div class="contact-info">
    <h2>Get in Touch</h2>

    <div class="info-box">
      <strong>📍 Location:</strong>
      Mumbai, India
    </div>

    <div class="info-box">
      <strong>📧 Email:</strong>
      support@globalhub.com
    </div>

    <div class="info-box">
      <strong>📞 Phone:</strong>
      +91 9876543210
    </div>

    <!-- Map -->
    <div class="map">
      <iframe 
        src="https://maps.google.com/maps?q=Mumbai&t=&z=13&ie=UTF8&iwloc=&output=embed"
        width="100%" height="200" style="border:0;">
      </iframe>
    </div>

  </div>

</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 GlobalHub | Designed by Neha Vishwakarma</p>
</footer>

</body>
</html>
